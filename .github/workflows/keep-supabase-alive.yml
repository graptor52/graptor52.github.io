name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:  # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -f -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            https://ivxjtjutarmxolzyluwn.supabase.co/rest/v1/
